name: Compilar aplicacion iOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Verificar archivos
        run: |
          pwd
          ls -la
          cat project.yml
          find iOSApp -type f

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Verificar proyecto
        run: xcodebuild -list -project QuePersonaje.xcodeproj

      - name: Compilar aplicacion
        run: |
          set -o pipefail
          xcodebuild \
            -project QuePersonaje.xcodeproj \
            -scheme QuePersonaje \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
