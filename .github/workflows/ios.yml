
name: Compilar aplicacion iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Compilar aplicacion
        run: |
          xcodebuild \
            -project QuePersonaje.xcodeproj \
            -scheme QuePersonaje \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Guardar aplicacion compilada
        uses: actions/upload-artifact@v4
        with:
          name: QuePersonaje-iOS
          path: build/Build/Products/Debug-iphonesimulator/QuePersonaje.app
          if-no-files-found: error
